<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thần Cơ Diệu Toán - Tử Vi & Quẻ Dịch</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0b18, #181328, #100b1e);
            color: #e2e8f0; min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: center;
        }
        .container {
            background: rgba(26, 21, 40, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(147, 112, 219, 0.25); border-radius: 16px;
            padding: 30px; max-width: 700px; width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }
        h1, h2 { text-align: center; color: #f1c40f; margin-bottom: 20px; text-shadow: 0 0 12px rgba(241, 196, 15, 0.3); }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #b8a9c9; font-weight: 600; }
        input[type="file"], textarea {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(147, 112, 219, 0.3);
            background: rgba(13, 11, 24, 0.6); color: #fff; font-size: 15px; outline: none;
        }
        .section-page { opacity: 1; transition: opacity 0.4s ease-in-out; }
        .fade-out { opacity: 0; }
        .hidden { display: none !important; }
        .menu-grid { display: grid; gap: 15px; margin-top: 20px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
        .menu-card {
            background: rgba(45, 34, 68, 0.5); border: 1px solid rgba(186, 147, 246, 0.3);
            border-radius: 12px; padding: 25px 15px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .menu-card:hover { background: rgba(63, 47, 95, 0.7); border-color: #f1c40f; transform: translateY(-3px); }
        .menu-card h3 { color: #f1c40f; margin-bottom: 10px; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: linear-gradient(45deg, #d4af37, #f1c40f); color: #000;
            font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #ccc; margin-top: 15px; }
        .result-box {
            margin-top: 25px; padding: 20px; border-radius: 8px;
            background: rgba(13, 11, 24, 0.6); border-left: 4px solid #f1c40f;
            white-space: pre-line; line-height: 1.8; font-size: 15px; max-height: 450px; overflow-y: auto;
        }
        .quote-box {
            font-style: italic; background: rgba(241, 196, 15, 0.08);
            padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed rgba(241, 196, 15, 0.4);
        }
        #imagePreview { max-width: 100%; max-height: 250px; margin-top: 10px; border-radius: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="landingPage" class="section-page">
        <h1>☯ KHÍ ĐẠO THẦN CƠ ☯</h1>
        <p style="text-align: center; margin-bottom: 25px; color: #94a3b8;">Chọn một phương thức để khởi tạo quẻ vận:</p>
        <div class="menu-grid">
            <div class="menu-card" onclick="switchSection('landingPage', 'quePage')">
                <h3>📜 Gieo Quẻ Thi Văn</h3>
                <p style="font-size: 13px;">Rút quẻ ngẫu nhiên nhận triết lý danh nhân & lời giải chi tiết.</p>
            </div>
            <div class="menu-card" onclick="switchSection('landingPage', 'tuViPage')">
                <h3>🖼️ Xem Lá Số Tử Vi</h3>
                <p style="font-size: 13px;">Tải ảnh lá số tử vi lên để Thầy AI đọc & luận giải định mệnh.</p>
            </div>
        </div>
    </div>

    <div id="quePage" class="section-page hidden">
        <h2>📜 GIEO QUẺ THI VĂN NGẪU NHIÊN</h2>
        <div class="form-group">
            <label>Nhập điều bạn đang trăn trở / thắc mắc:</label>
            <textarea id="queQuestion" rows="3" placeholder="Ví dụ: Công việc sắp tới của tôi có suôn sẻ không?"></textarea>
        </div>
        <button class="btn" onclick="gieoQue()">🎲 Bốc Quẻ Ngẫu Nhiên</button>
        
        <div id="queResultContainer" class="hidden">
            <div class="result-box">
                <div class="quote-box" id="quoteDisplay"></div>
                <div id="queAnalysis"></div>
            </div>
        </div>
        <button class="btn btn-secondary" onclick="switchSection('quePage', 'landingPage')">⬅️ Quay lại trang chủ</button>
    </div>

    <div id="tuViPage" class="section-page hidden">
        <h2>🖼️ ĐỌC LÁ SỐ TỬ VI QUA ẢNH</h2>
        <div class="form-group">
            <label>Tải ảnh Bảng Lá Số Tử Vi của bạn lên:</label>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
            <img id="imagePreview" alt="Lá số preview">
        </div>
        <div class="form-group">
            <label>Yêu cầu cụ thể (Tùy chọn):</label>
            <textarea id="tuViRequest" rows="2" placeholder="Ví dụ: Luận giải giúp tôi về Mệnh, Tài Bạch và Quan Lộc."></textarea>
        </div>
        <button class="btn" onclick="luanLaSo()">🔮 AI Luận Giải Lá Số</button>

        <div id="tuViResult" class="result-box hidden"></div>
        <button class="btn btn-secondary" onclick="switchSection('tuViPage', 'landingPage')">⬅️ Quay lại trang chủ</button>
    </div>
</div>

<script>
    // 🔗 DÁN LINK CLOUDFLARE WORKER CỦA BẠN VÀO ĐÂY:
    const WORKER_URL = "https://tuvi-api.username.workers.dev";

    const quotesList = [
        { quote: "Chuyện cũ qua rồi, chuyện mới lại đến. Nước chảy mây trôi, lòng không vướng bận.", author: "Thiền sư Thích Nhất Hạnh" },
        { quote: "Thiện căn ở tại lòng ta / Chữ tâm kia mới bằng ba chữ tài.", author: "Nguyễn Du (Truyện Kiều)" },
        { quote: "Người ta chỉ nhìn thấy rõ ràng bằng trái tim. Cốt lõi là điều vô hình trong mắt dung tục.", author: "Antoine de Saint-Exupéry" },
        { quote: "Cứ đi rồi sẽ đến, cứ gõ cửa rồi cửa sẽ mở.", author: "Triết lý phương Đông" },
        { quote: "Sống trong đời sống cần có một tấm lòng, để làm gì em biết không? Để gió cuốn đi...", author: "Trịnh Công Sơn" },
        { quote: "Vết thương là nơi ánh sáng đi vào bạn.", author: "Rumi" }
    ];

    function switchSection(currentId, targetId) {
        const currentEl = document.getElementById(currentId);
        const targetEl = document.getElementById(targetId);
        currentEl.classList.add('fade-out');
        setTimeout(() => {
            currentEl.classList.add('hidden');
            currentEl.classList.remove('fade-out');
            targetEl.classList.add('fade-out');
            targetEl.classList.remove('hidden');
            setTimeout(() => targetEl.classList.remove('fade-out'), 50);
        }, 400);
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('imagePreview');
                img.src = e.target.result;
                img.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    async function gieoQue() {
        const randomQuote = quotesList[Math.floor(Math.random() * quotesList.length)];
        const question = document.getElementById('queQuestion').value.trim();

        document.getElementById('queResultContainer').classList.remove('hidden');
        document.getElementById('quoteDisplay').innerHTML = `<strong>" ${randomQuote.quote} "</strong><br><small>— ${randomQuote.author}</small>`;
        document.getElementById('queAnalysis').innerText = "☯ Thầy AI đang nghiệm quẻ từ câu thơ trên...";

        const prompt = `Tôi rút được câu trích dẫn: "${randomQuote.quote}" của ${randomQuote.author}. Câu hỏi/trăn trở: "${question || 'Xin lời khuyên tổng quan'}". Hãy đóng vai Thầy Quẻ Kinh Dịch giải đáp sâu sắc cho tôi.`;

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            document.getElementById('queAnalysis').innerText = data.candidates[0].content.parts[0].text;
        } catch (e) {
            document.getElementById('queAnalysis').innerText = "Lỗi: " + e.message;
        }
    }

    async function luanLaSo() {
        const fileInput = document.getElementById('imageInput');
        const userRequest = document.getElementById('tuViRequest').value.trim();
        const resultDiv = document.getElementById('tuViResult');

        if (!fileInput.files[0]) return alert('Vui lòng tải lên ảnh lá số tử vi!');

        resultDiv.classList.remove('hidden');
        resultDiv.innerText = "🔍 AI đang quét và đọc các cung sao trên lá số...";

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onloadend = async function() {
            const base64Data = reader.result.split(',')[1];
            const prompt = `Bạn là chuyên gia Tử Vi Đẩu Số cao cấp. Hãy đọc bảng lá số tử vi trong hình ảnh này và luận giải chi tiết. ${userRequest ? 'Yêu cầu thêm: ' + userRequest : ''}`;

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inline_data: { mime_type: file.type, data: base64Data } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                resultDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                resultDiv.innerText = "Lỗi xử lý ảnh: " + e.message;
            }
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
