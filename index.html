<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Tử Vi & Bói Quẻ AI</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, button, textarea { width: 100%; padding: 10px; box-sizing: border-box; }
        button { background-color: #8e24aa; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #6a1b9a; }
        #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; white-space: pre-line; }
    </style>
</head>
<body>

    <h2>XEM TỬ VI & GIEO QUẺ AI</h2>

    <div class="form-group">
        <label>Dán API Key của bạn vào đây:</label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
    </div>

    <div class="form-group">
        <label>Chọn hình thức xem:</label>
        <select id="type">
            <option value="tu_vi">Xem Tử Vi / Lá Số</option>
            <option value="kinh_dich">Gieo Quẻ Kinh Dịch</option>
        </select>
    </div>

    <div class="form-group">
        <label>Thông tin của bạn (Họ tên, ngày tháng năm sinh Âm/Dương, giờ sinh, hoặc câu hỏi gieo quẻ):</label>
        <textarea id="userInfo" rows="4" placeholder="Ví dụ: Nguyễn Văn A, sinh ngày 15/08/1995 lúc 08h30 sáng (Dương lịch). Xin luận giải tổng quan công danh, sự nghiệp năm nay."></textarea>
    </div>

    <button onclick="xemBoi()">Luận Giải Ngay</button>

    <h3>Kết quả luận giải:</h3>
    <div id="result">Kết quả sẽ xuất hiện ở đây...</div>

    <script>
        async function xemBoi() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const type = document.getElementById('type').value;
            const userInfo = document.getElementById('userInfo').value.trim();
            const resultDiv = document.getElementById('result');

            if (!apiKey) {
                alert('Vui lòng nhập API Key!');
                return;
            }
            if (!userInfo) {
                alert('Vui lòng nhập thông tin hoặc câu hỏi!');
                return;
            }

            resultDiv.innerText = "Thầy AI đang bấm ngón tay luận giải, vui lòng đợi trong giây lát...";

            // Lời dặn đóng vai (System Instruction)
            const systemPrompt = "Bạn là một bậc thầy cao tay về Tử Vi Đẩu Số và Kinh Dịch có 30 năm kinh nghiệm. Hãy sử dụng ngôn phong trang trọng, uyên bác nhưng dễ hiểu để luận giải. Trả lời chi tiết, khách quan, phân tích sâu sắc các khía cạnh.";

            const userPrompt = type === 'tu_vi' 
                ? `Hãy lập luận giải Tử Vi dựa trên thông tin sau:\n${userInfo}`
                : `Hãy gieo quẻ và luận giải Kinh Dịch cho câu hỏi/thông tin sau:\n${userInfo}`;

            try {
                // Gọi API Google AI Studio (Dùng mô hình gemini-2.5-flash)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        contents: [{
                            parts: [{ text: userPrompt }]
                        }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    resultDiv.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    resultDiv.innerText = "Lỗi: Không nhận được phản hồi từ AI. Hãy kiểm tra lại API Key.";
                }
            } catch (error) {
                resultDiv.innerText = "Lỗi kết nối: " + error.message;
            }
        }
    </script>
</body>
</html>
